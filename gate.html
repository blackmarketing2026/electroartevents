<!DOCTYPE html>
<html lang="de">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta name="robots" content="noindex, nofollow">
  <title>Hier entsteht eine neue Webseite</title>
  <style>
    * {
      box-sizing: border-box;
    }

    body {
      display: grid;
      place-items: center;
      min-height: 100vh;
      margin: 0;
      padding: 24px;
      background: #05080d;
      color: #f6fbff;
      font-family: Inter, ui-sans-serif, system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
    }

    .karte {
      width: min(420px, 100%);
      padding: 40px 32px;
      border: 1px solid rgba(255, 255, 255, 0.14);
      border-radius: 8px;
      background: rgba(16, 26, 39, 0.72);
      box-shadow: 0 24px 70px rgba(0, 0, 0, 0.38);
      text-align: center;
    }

    .logo {
      display: block;
      max-width: 160px;
      margin: 0 auto 28px;
    }

    h1 {
      margin: 0 0 12px;
      font-size: 1.5rem;
      line-height: 1.25;
    }

    p {
      margin: 0 0 28px;
      color: #aac0cc;
      font-size: 0.98rem;
    }

    form {
      display: grid;
      gap: 12px;
    }

    input[type="password"] {
      min-height: 48px;
      padding: 0 16px;
      border: 1px solid rgba(255, 255, 255, 0.22);
      border-radius: 6px;
      background: rgba(5, 8, 13, 0.6);
      color: #f6fbff;
      font: inherit;
      text-align: center;
    }

    input[type="password"]:focus {
      outline: 2px solid #17c7f4;
      outline-offset: 2px;
    }

    button {
      min-height: 48px;
      border: none;
      border-radius: 999px;
      background: linear-gradient(135deg, #17c7f4, #087fe7);
      color: #021018;
      font: inherit;
      font-weight: 800;
      cursor: pointer;
    }

    .fehler {
      display: none;
      margin: -12px 0 12px;
      color: #ff3f75;
      font-size: 0.9rem;
    }

    .fehler.sichtbar {
      display: block;
    }
  </style>
</head>
<body>
  <div class="karte">
    <img class="logo" src="images/logo.png" alt="DJ ElectroArt Logo">
    <h1>Hier entsteht eine neue Webseite</h1>
    <p>DJ ElectroArt ist bald online. Bis dahin nur mit Passwort erreichbar.</p>
    <p class="fehler" id="fehler">Falsches Passwort. Bitte erneut versuchen.</p>
    <form method="POST" action="/gate">
      <input type="password" name="passwort" placeholder="Passwort" autofocus required>
      <button type="submit">Eintreten</button>
    </form>
  </div>

  <script>
    if (new URLSearchParams(location.search).has('fehler')) {
      document.getElementById('fehler').classList.add('sichtbar');
    }
  </script>
</body>
</html>
